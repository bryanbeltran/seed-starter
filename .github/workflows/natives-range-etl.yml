name: Native Range Evidence ETL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 1 * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: natives-range-etl
  cancel-in-progress: false

jobs:
  refresh-range-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch enabled range evidence and report all configured sources
        run: pnpm run etl:natives-range-evidence -- --write
      - name: Validate native data and exercise local evidence rules
        run: >-
          pnpm exec vitest run
          scripts/etl-natives-range-evidence.test.mjs
          scripts/etl-natives-county.test.mjs
          scripts/check-native-coverage.test.mjs
          src/natives/rangeEvidence.test.ts
          src/natives/rangeEvidence.multi.test.ts
          src/natives/resolveNatives.test.ts
      - name: Report lower-48 coverage
        if: always()
        run: node scripts/check-native-coverage.mjs > "${RUNNER_TEMP}/native-coverage-report.json"
      - name: Upload evidence and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-range-evidence
          path: |
            data/natives/plant-range-evidence.json
            data/natives/native-sources.json
            ${{ runner.temp }}/native-coverage-report.json
      - name: Open PR when evidence changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(natives): refresh native range evidence"
          branch: chore/natives-range-etl
          delete-branch: true
          title: "chore(natives): refresh native range evidence"
          body: |
            Monthly native range-evidence refresh and source-readiness report.

            - Refreshes currently enabled USDA PLANTS county evidence and summarizes every configured source.
            - Reports owner authorization separately from source terms, with per-source lower-48 county and state coverage.
            - BONAP's county maps/TDC interfaces and NPIN's autocomplete endpoint are documented; neither is enabled as nativity evidence until its source-specific adapter and claim semantics pass review.
            - Keeps unknown statuses and unresolved geography non-affirmative.
            - Passed staged provenance validation and native coverage tests.

            Review the [lower-48 coverage report from this run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) in the `native-range-evidence` artifact for source status and evidence date/status changes before merging.
          add-paths: data/natives/plant-range-evidence.json
